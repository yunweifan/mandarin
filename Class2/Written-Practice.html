<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Práctica Escrita Zhuyin - Lección 2</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --border-main: #222222;
      --border-soft: #555555;
      --text-main: #111111;
      --text-muted: #444444;
      --cell-size: 15mm;
      --zhuyin-width: 7.5mm;
    }

    @page {
      size: letter;
      margin: 8mm 10mm;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans TC', sans-serif;
      color: var(--text-main);
      background: #f3f4f6;
      padding: 12px;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .toolbar {
      max-width: 196mm;
      margin: 0 auto 12px auto;
      display: flex;
      justify-content: flex-end;
    }

    .btn-print {
      border: 1px solid #333333;
      background: #ffffff;
      color: #111111;
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
    }

    .btn-print:hover {
      background: #e5e7eb;
    }

    .sheet {
      width: 196mm;
      min-height: 263mm;
      margin: 0 auto;
      background: #ffffff;
      padding: 2mm 0;
    }

    .vocab-block {
      margin-bottom: 4.5mm;
      break-inside: avoid;
      page-break-inside: avoid;
    }

    .grid-row {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      gap: 4mm;
    }

    .grid-row + .grid-row {
      margin-top: -1px;
    }

    .repeat-group {
      display: inline-flex;
      align-items: stretch;
      border: 1.2px solid var(--border-main);
    }

    .repeat-group + .repeat-group {
      margin-left: 2.2mm;
    }

    .char-pair {
      display: inline-flex;
      align-items: stretch;
      height: var(--cell-size);
    }

    .char-pair + .char-pair {
      border-left: 1.2px solid var(--border-main);
    }

    .char-box {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 9.5mm;
      font-weight: 500;
      line-height: 1;
      color: var(--text-main);
      border-right: 1px solid var(--border-soft);
    }

    .zhuyin-box {
      width: var(--zhuyin-width);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.4mm 0;
    }

    /* Zhuyin vertical: iniciales/mediales/finales en columna y tono a la derecha */
    .zy-stack {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      font-family: 'Noto Sans TC', sans-serif;
      font-size: 2.85mm;
      line-height: 1.05;
      color: var(--text-main);
    }

    .zy-cols {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .zy-tone {
      font-size: 2.8mm;
      line-height: 1;
      margin-left: 0.2mm;
      align-self: center;
    }

    .zy-tone-light {
      font-size: 2.8mm;
      line-height: 1;
      margin-bottom: 0.2mm;
      text-align: center;
    }

    .row-meta {
      display: inline-flex;
      align-items: baseline;
      gap: 2.2mm;
      padding-left: 1mm;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 3.3mm;
    }

    .meta-pinyin {
      font-weight: 600;
      color: var(--text-main);
    }

    .meta-meaning {
      color: var(--text-muted);
    }

    @media print {
      body {
        background: #ffffff;
        padding: 0;
      }

      .toolbar {
        display: none !important;
      }

      .sheet {
        width: 100%;
        min-height: auto;
        padding: 0;
      }
    }
  </style>
</head>
<body>

  <div class="toolbar">
    <button type="button" class="btn-print" onclick="window.print()">Imprimir / Guardar PDF</button>
  </div>

  <main id="practice-sheet" class="sheet"></main>

  <script>
    (function () {
      const LESSON_2_VOCAB = [
        {
          meaning: "Yo",
          pinyin: "wǒ",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" }
          ]
        },
        {
          meaning: "Tú",
          pinyin: "nǐ",
          items: [
            { char: "你", symbols: ["ㄋ", "ㄧ"], tone: "ˇ" }
          ]
        },
        {
          meaning: "Él",
          pinyin: "tā",
          items: [
            { char: "他", symbols: ["ㄊ", "ㄚ"], tone: "" }
          ]
        },
        {
          meaning: "Partícula plural",
          pinyin: "men",
          items: [
            { char: "們", symbols: ["ㄇ", "ㄣ"], tone: "˙", lightTop: true }
          ]
        },
        {
          meaning: "Uno (1)",
          pinyin: "yī",
          items: [
            { char: "一", symbols: ["ㄧ"], tone: "" }
          ]
        },
        {
          meaning: "Dos (2)",
          pinyin: "èr",
          items: [
            { char: "二", symbols: ["ㄦ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Tres (3)",
          pinyin: "sān",
          items: [
            { char: "三", symbols: ["ㄙ", "ㄢ"], tone: "" }
          ]
        },
        {
          meaning: "Cuatro (4)",
          pinyin: "sì",
          items: [
            { char: "四", symbols: ["ㄙ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Cinco (5)",
          pinyin: "wǔ",
          items: [
            { char: "五", symbols: ["ㄨ"], tone: "ˇ" }
          ]
        },
        {
          meaning: "Seis (6)",
          pinyin: "liù",
          items: [
            { char: "六", symbols: ["ㄌ", "ㄧ", "ㄡ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Siete (7)",
          pinyin: "qī",
          items: [
            { char: "七", symbols: ["ㄑ", "ㄧ"], tone: "" }
          ]
        },
        {
          meaning: "Ocho (8)",
          pinyin: "bā",
          items: [
            { char: "八", symbols: ["ㄅ", "ㄚ"], tone: "" }
          ]
        },
        {
          meaning: "Nueve (9)",
          pinyin: "jiǔ",
          items: [
            { char: "九", symbols: ["ㄐ", "ㄧ", "ㄡ"], tone: "ˇ" }
          ]
        },
        {
          meaning: "Diez (10)",
          pinyin: "shí",
          items: [
            { char: "十", symbols: ["ㄕ"], tone: "ˊ" }
          ]
        },
        {
          meaning: "Cien (100)",
          pinyin: "bǎi",
          items: [
            { char: "百", symbols: ["ㄅ", "ㄞ"], tone: "ˇ" }
          ]
        },
        {
          meaning: "Me llamo...",
          pinyin: "wǒ jiào",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" },
            { char: "叫", symbols: ["ㄐ", "ㄧ", "ㄠ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Tengo ... años",
          pinyin: "wǒ jīn nián ... suì",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" },
            { char: "今", symbols: ["ㄐ", "ㄧ", "ㄣ"], tone: "" },
            { char: "年", symbols: ["ㄋ", "ㄧ", "ㄢ"], tone: "ˊ" },
            { char: "歲", symbols: ["ㄙ", "ㄨ", "ㄟ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Vengo de / Soy de...",
          pinyin: "wǒ lái zì",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" },
            { char: "來", symbols: ["ㄌ", "ㄞ"], tone: "ˊ" },
            { char: "自", symbols: ["ㄗ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Vivo en...",
          pinyin: "wǒ zhù zài",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" },
            { char: "住", symbols: ["ㄓ", "ㄨ"], tone: "ˋ" },
            { char: "在", symbols: ["ㄗ", "ㄞ"], tone: "ˋ" }
          ]
        },
        {
          meaning: "Soy...",
          pinyin: "wǒ shì",
          items: [
            { char: "我", symbols: ["ㄨ", "ㄛ"], tone: "ˇ" },
            { char: "是", symbols: ["ㄕ"], tone: "ˋ" }
          ]
        }
      ];

      function renderZhuyin(item) {
        const stack = document.createElement("div");
        stack.className = "zy-stack";

        const cols = document.createElement("div");
        cols.className = "zy-cols";

        if (item.tone === "˙" && item.lightTop) {
          const light = document.createElement("span");
          light.className = "zy-tone-light";
          light.textContent = "˙";
          cols.appendChild(light);
        }

        item.symbols.forEach((sym) => {
          const s = document.createElement("span");
          s.textContent = sym;
          cols.appendChild(s);
        });

        stack.appendChild(cols);

        if (item.tone && !(item.tone === "˙" && item.lightTop)) {
          const tone = document.createElement("span");
          tone.className = "zy-tone";
          tone.textContent = item.tone;
          stack.appendChild(tone);
        }

        return stack;
      }

      function buildRepeatGroup(vocab, showZhuyin) {
        const group = document.createElement("div");
        group.className = "repeat-group";

        vocab.items.forEach((item) => {
          const pair = document.createElement("div");
          pair.className = "char-pair";

          const charBox = document.createElement("div");
          charBox.className = "char-box";
          charBox.textContent = item.char;

          const zhuyinBox = document.createElement("div");
          zhuyinBox.className = "zhuyin-box";
          if (showZhuyin) {
            zhuyinBox.appendChild(renderZhuyin(item));
          }

          pair.appendChild(charBox);
          pair.appendChild(zhuyinBox);
          group.appendChild(pair);
        });

        return group;
      }

      function renderSheet() {
        const sheet = document.getElementById("practice-sheet");
        sheet.innerHTML = "";

        LESSON_2_VOCAB.forEach((vocab) => {
          const charCount = vocab.items.length;
          const repeats = charCount <= 2 ? 3 : 2;

          const block = document.createElement("section");
          block.className = "vocab-block";

          // Fila 1: Referencia con Zhuyin + Pinyin y significado a la derecha
          const refRow = document.createElement("div");
          refRow.className = "grid-row";
          refRow.appendChild(buildRepeatGroup(vocab, true));

          const meta = document.createElement("div");
          meta.className = "row-meta";
          meta.innerHTML = `<span class="meta-pinyin">${vocab.pinyin}</span><span class="meta-meaning">— ${vocab.meaning}</span>`;
          refRow.appendChild(meta);

          // Fila 2: Práctica sin Zhuyin (repetida 3 veces en cortos, 2 en largos)
          const practiceRow = document.createElement("div");
          practiceRow.className = "grid-row";
          for (let i = 0; i < repeats; i++) {
            practiceRow.appendChild(buildRepeatGroup(vocab, false));
          }

          block.appendChild(refRow);
          block.appendChild(practiceRow);
          sheet.appendChild(block);
        });
      }

      renderSheet();
    })();
  </script>
</body>
</html>
